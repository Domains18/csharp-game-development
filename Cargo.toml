[package]
name = "bevy-beach-buggy"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15"

# For web builds, add:
# wasm-bindgen = "0.2"
# web-sys = "0.3"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"
